# Local MySQL and MariaDB servers for the mysql driver's integration tests.
#
#   docker compose -f rdb/drivers/mysql/docker-compose.yml up -d --wait
#   RDB_MYSQL_URL=mysql://rdbtest:rdbtest@localhost:53306/rdbtest make -C rdb/drivers/mysql tests
#   RDB_MYSQL_URL=mariadb://rdbtest:rdbtest@localhost:53307/rdbtest make -C rdb/drivers/mysql tests
#   docker compose -f rdb/drivers/mysql/docker-compose.yml down
#
# The data lives in the containers and is discarded with them. The images
# are pinned by digest (MySQL 8.4.13 and MariaDB 11.8.9).
services:
  mysql:
    image: mysql@sha256:a81d043930e51745522bd5c430961cf8286f0a23f0a9a2a6e0108f7ea71b0902
    environment:
      MYSQL_ROOT_PASSWORD: rdbtest-root
      MYSQL_DATABASE: rdbtest
      MYSQL_USER: rdbtest
      MYSQL_PASSWORD: rdbtest
    ports:
      - "53306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-urdbtest", "-prdbtest"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0

  mariadb:
    image: mariadb@sha256:d36f18d65a0459510b8b0f643b226a6d299e3206486e2b64ff20754a6d291707
    environment:
      MARIADB_ROOT_PASSWORD: rdbtest-root
      MARIADB_DATABASE: rdbtest
      MARIADB_USER: rdbtest
      MARIADB_PASSWORD: rdbtest
    ports:
      - "53307:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
