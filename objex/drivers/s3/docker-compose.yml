# Local S3-compatible service for the s3 driver's integration tests.
#
#   docker compose -f objex/drivers/s3/docker-compose.yml up -d
#   OBJEX_S3_ENDPOINT=http://localhost:9000 make -C objex/drivers/s3 tests
#   docker compose -f objex/drivers/s3/docker-compose.yml down
#
# MinIO no longer publishes public images; Chainguard's build is pinned by
# digest (MinIO RELEASE.2026-11-12T01-15-23Z).
services:
  minio:
    image: cgr.dev/chainguard/minio@sha256:ddfab4c402bf32e7701600d16d8c40dbccfab4c4e5340eef4c324394349c7926
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: objextest
      MINIO_ROOT_PASSWORD: objextest-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    tmpfs:
      - /data:uid=65532,gid=65532
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1.0
