name: Linters

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

permissions:
  contents: read

jobs:
  generate-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
      go-version: ${{ steps.versions.outputs.go-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find Go modules
        id: set-matrix
        run: |
          directories=$(find . -type f -name go.mod -not -path '*/vendor/*' -not -path '*/node_modules/*' -not -path './.tools/*' | sed -e 's|/go.mod$||' | LC_ALL=C sort | jq -R -s -c 'split("\n")[:-1]')
          echo "matrix=${directories}" >> "$GITHUB_OUTPUT"

      - name: Read pinned Go version
        id: versions
        run: echo "go-version=$(make -s --no-print-directory print-required-go-version)" >> "$GITHUB_OUTPUT"

  golangci:
    needs: generate-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.generate-matrix.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ needs.generate-matrix.outputs.go-version }}
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: Cache pinned tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/tools.sh', 'make/development.mk') }}

      # The same pinned golangci-lint and configuration as `make lint` and
      # `make format-check`, run from scripts/tools.sh.
      - name: Check formatting
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: '"$GITHUB_WORKSPACE/scripts/tools.sh" golangci-lint fmt --config "$GITHUB_WORKSPACE/.golangci.yml" --diff'

      - name: Run golangci-lint
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: '"$GITHUB_WORKSPACE/scripts/tools.sh" golangci-lint run --config "$GITHUB_WORKSPACE/.golangci.yml" --timeout=3m ./...'

      - name: Run go vet
        working-directory: ${{ matrix.module }}
        env:
          GOWORK: "off"
        run: go vet ./...

  # Single required status check that stays stable as modules are added.
  lint-result:
    if: always()
    needs: [generate-matrix, golangci]
    runs-on: ubuntu-latest
    steps:
      - name: Check lint results
        run: |
          if [ "${{ needs.generate-matrix.result }}" != "success" ] || [ "${{ needs.golangci.result }}" != "success" ]; then
            echo "Lint failed: generate-matrix=${{ needs.generate-matrix.result }}, golangci=${{ needs.golangci.result }}"
            exit 1
          fi
