name: Lint commit messages

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  # Reported on merge queue runs so a required check never blocks the queue;
  # the job itself only runs for pull requests.
  merge_group:

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Exactly one commit
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          count=$(git rev-list --count "$BASE..$HEAD")
          if [ "$count" -ne 1 ]; then
            git log --oneline "$BASE..$HEAD"
            echo "::error::A pull request has exactly one commit; this one has $count. Squash them into one."
            exit 1
          fi

      - name: Commitlint
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json

      - name: Validate pull request title
        uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6 # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
