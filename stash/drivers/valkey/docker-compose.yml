# Local Valkey server for the valkey driver's integration tests.
#
#   docker compose -f stash/drivers/valkey/docker-compose.yml up -d --wait
#   STASH_VALKEY_URL=valkey://localhost:56390/0 make -C stash/drivers/valkey tests
#   docker compose -f stash/drivers/valkey/docker-compose.yml down
#
# The data lives in memory and is discarded with the container. The image is
# pinned by digest (Valkey 9.1.3, Alpine).
services:
  valkey:
    image: valkey/valkey@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
    command: ["valkey-server", "--save", "", "--appendonly", "no"]
    ports:
      - "56390:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
